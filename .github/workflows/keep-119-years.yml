name: Keep 119 Years Render Alive

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping 119 Years Render
        run: curl -fsS --connect-timeout 20 --max-time 90 --retry 5 --retry-all-errors --retry-delay 10 https://telegram-119-years-ss2d.onrender.com
